<html lang="ja">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="reset.css" rel="stylesheet">

<body>

  <header>
  
  <button class="hamburger" type="button" area-label="メニューを開く">
    <span></span>
    <span></span>
  </button>
  <h1 class="logo"><img src="swan_logo.png" alt=""></h1> 
  <nav class="global">
    <ul>
      <li><a href="#">Value</a></li>
      <li><a href="#">Works</a></li>
      <li><a href="#">Servise</a></li>
      <li><a href="#">Flow</a></li>
      <li><a href="#">Column</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
  </header>


  <section class="about">
    <h2>Flonne Design Studio</h2>
    <img src="web.jpg" alt="#">
    <img src="flonne_type.jpg" alt="#">

    <img src="flonne_card.jpg" alt="#">
    <img src="swan_jewelry.jpg" alt="#">
  </section>
    
  <footer>
    <section>
    <h2>Flonne Design Studio</h2>
    </section>

    <section>
    <h3>Instagram</h3>
    <a href="#"><i class="fa-brands fa-instagram"></i></a>

    <nav class="local">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(function () {

  // ハンバーガーメニュー
  $('.hamburger').on('click', function () {
    $('.global').toggleClass('is-open');
    $(this).toggleClass('is-open');
    $('body').toggleClass('is-open');
  });

  // メニュー内リンク
  $('.global a').on('click', function (e) {
    e.preventDefault();

    const href = $(this).attr('href');

    $('.global').removeClass('is-open');
    $('.hamburger').removeClass('is-open');
    $('body').removeClass('is-open');

    setTimeout(function () {
      window.location.href = href;
    }, 1200);
  });
  
});



</script>



</body>
</html>
